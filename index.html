<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5,viewport-fit=cover">
<title>Luk — Life Is One</title>
<meta name="description" content="La vida es una. One life, undivided. The wall of Luk — builder, painter, musician, Amsterdam.">
<meta property="og:title" content="Luk — Life Is One">
<meta property="og:description" content="La vida es una. One life, undivided.">
<meta property="og:type" content="profile">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════════════════════
   LIFE IS ONE — design tokens.
   Change these six hues and the entire site re-tunes itself.
   ═══════════════════════════════════════════════════════════════ */
:root{
  --ink:#0E0D0C;
  --paper:#F7F3EA;
  --mist:#9A938A;

  --make:#2E5BFF;   /* code, products, the venture builder */
  --sound:#FF4D2E;  /* music, vinyl */
  --paint:#E4489B;  /* canvas, colour */
  --voice:#F5A623;  /* podcast, words out loud */
  --mind:#2F8F5B;   /* books, thinking */
  --life:#7B5CFF;   /* Amsterdam, people, the rest of it */

  --disp:"Instrument Serif",Iowan Old Style,Georgia,serif;
  --ui:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;

  --lift:0 18px 44px rgba(0,0,0,.34), 0 2px 8px rgba(0,0,0,.22);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0E0D0C}
body{font-family:var(--ui);color:var(--paper);-webkit-font-smoothing:antialiased;
     overscroll-behavior:none;touch-action:none}
button{font-family:inherit}

/* ── the room ───────────────────────────────────────────────── */
#room{position:fixed;inset:0;overflow:hidden;cursor:grab;background:
  radial-gradient(1400px 900px at 22% 12%, rgba(46,91,255,.10), transparent 62%),
  radial-gradient(1200px 800px at 78% 22%, rgba(255,77,46,.09), transparent 60%),
  radial-gradient(1100px 900px at 52% 88%, rgba(123,92,255,.10), transparent 62%),
  #0E0D0C}
#room.drag{cursor:grabbing}
#room:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(circle at 50% 45%, transparent 42%, rgba(0,0,0,.55) 100%)}
#room:after{content:"";position:fixed;inset:-50%;pointer-events:none;z-index:2;opacity:.05;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>")}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}

/* ── regions ────────────────────────────────────────────────── */
/* ── regions ──────────────────────────────────────────────────
   A region is a coloured area of one continuous space. ONE is the
   exception: it is a circle, it sits in the middle, and it is the
   only region that is PUBLIC — anything whose centre lands inside
   it is visible to everyone on Life Is One. Everything else is his
   alone. See inPublic() / syncPub().
   ─────────────────────────────────────────────────────────────── */
.region{position:absolute;border-radius:64px;pointer-events:none;
  transition:box-shadow .25s ease}
.region.circle{border-radius:50%}
.region.circle .label{left:0;right:0;top:12%;text-align:center;font-size:150px}
.region.circle .sub{left:0;right:0;top:calc(12% + 150px);text-align:center}
/* the public one reads as live: a solid ring instead of a dashed one */
.region.pubzone .ring{border-style:solid;border-width:2px;opacity:.5}
.region.pubzone .glow{opacity:.2}
.region .live{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
  display:none;align-items:center;gap:7px;padding:7px 14px;border-radius:99px;
  background:rgba(18,16,15,.86);border:1px solid rgba(255,255,255,.14);
  font-size:9.5px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  color:var(--paper);white-space:nowrap}
.region.pubzone .live{display:inline-flex}
.region .live b{width:7px;height:7px;border-radius:50%;background:#06D6A0;
  box-shadow:0 0 0 4px rgba(6,214,160,.22);animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(6,214,160,0)}}
/* in edit mode a region can be picked up by its name and moved, items and all */
body.edit .region .label,body.edit .region .sub{pointer-events:auto;cursor:grab;
  transition:opacity .18s ease}
body.edit .region .label:hover{opacity:.34}
body.edit .region.dragging{box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 55%,transparent)}
/* a card that is currently public wears the ring too */
.card.pub{box-shadow:var(--lift),0 0 0 2px rgba(6,214,160,.55)}
.region .glow{position:absolute;inset:0;border-radius:inherit;opacity:.14;
  filter:blur(90px);background:var(--c)}
.region .ring{position:absolute;inset:0;border-radius:inherit;
  border:1px dashed color-mix(in srgb,var(--c) 42%, transparent);opacity:.34}
.region .label{position:absolute;left:44px;top:30px;font-family:var(--disp);
  font-size:120px;line-height:.9;letter-spacing:-.03em;color:var(--c);opacity:.20;white-space:nowrap}
.region .sub{position:absolute;left:48px;top:158px;font-size:13px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--c);opacity:.5;font-weight:600}

/* ── posters ────────────────────────────────────────────────── */
.card{position:absolute;border-radius:14px;box-shadow:var(--lift);overflow:hidden;
  background:#151312;display:flex;flex-direction:column;
  transition:box-shadow .2s ease,filter .2s ease}
.card:hover{box-shadow:0 26px 60px rgba(0,0,0,.5),0 3px 10px rgba(0,0,0,.3)}
.card .hdr{height:0;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;gap:7px;
  padding:0 10px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
  color:rgba(255,255,255,.6);background:rgba(0,0,0,.4);transition:height .18s}
body.edit .card .hdr{height:28px}
.card .hdr .dot{width:7px;height:7px;border-radius:50%;background:var(--c,#fff)}
.card .hdr .sp{flex:1}
.card .hdr b{cursor:grab;flex:1;user-select:none}
.card .hdr button{all:unset;cursor:pointer;padding:2px 6px;border-radius:5px;opacity:.65;font-size:12px}
.card .hdr button:hover{opacity:1;background:rgba(255,255,255,.16)}
.card .in{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
.card .rz{position:absolute;right:0;bottom:0;width:22px;height:22px;cursor:nwse-resize;display:none;z-index:6}
.card .rz:after{content:"";position:absolute;right:5px;bottom:5px;width:9px;height:9px;
  border-right:2px solid #fff;border-bottom:2px solid #fff;opacity:.6}
body.edit .card .rz{display:block}
body.edit .card{cursor:default}

/* media facade */
.fa{position:relative;flex:1;display:flex;flex-direction:column;cursor:pointer;background:#0a0a0a}
.fa .th{position:absolute;inset:0;background-size:cover;background-position:center}
.fa .sc{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.1) 0%,rgba(0,0,0,.02) 38%,rgba(0,0,0,.86) 100%)}
.fa .mt{position:relative;margin-top:auto;padding:12px 14px 14px}
.fa .bd{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;font-weight:800;
  letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:99px;
  background:rgba(255,255,255,.94);color:#111;margin-bottom:8px}
.fa h3{margin:0;font-size:15px;line-height:1.25;font-weight:600;color:#fff;
  text-shadow:0 1px 4px rgba(0,0,0,.7)}
.fa .sb{font-size:11.5px;color:rgba(255,255,255,.8);margin-top:4px}
.fa .pl{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%);width:58px;height:58px;
  border-radius:50%;background:rgba(255,255,255,.95);display:grid;place-items:center;
  box-shadow:0 10px 28px rgba(0,0,0,.5);transition:transform .16s}
.fa:hover .pl{transform:translate(-50%,-50%) scale(1.1)}
.fa .pl:after{content:"";border-left:17px solid #111;border-top:11px solid transparent;
  border-bottom:11px solid transparent;margin-left:5px}
.fa.audio .pl:after{border:0;content:"♫";font-size:26px;color:#111;margin:0}
.fa .hint{position:absolute;top:10px;right:10px;font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:#fff;background:rgba(0,0,0,.5);padding:4px 7px;border-radius:6px}
iframe.live{border:0;flex:1;width:100%;height:100%;background:#000}

/* link card */
.lk{flex:1;display:flex;flex-direction:column;justify-content:space-between;padding:16px;
  text-decoration:none;color:var(--paper);background:linear-gradient(160deg,#1b1917,#131110)}
.lk .ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  font-weight:900;font-size:16px;color:#fff;background:var(--c,#444)}
.lk h3{margin:12px 0 5px;font-size:16px;line-height:1.25;font-weight:600}
.lk .dm{font-size:11.5px;color:var(--mist)}
.lk .go{margin-top:12px;font-size:10px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--c,#fff)}

/* text blocks */
.tx{flex:1;padding:20px 22px;overflow:auto;outline:none}
.tx.manifesto{font-family:var(--disp);font-size:30px;line-height:1.18;letter-spacing:-.02em}
.tx.manifesto em{font-style:italic;color:var(--c,#fff)}
.tx.note{font-family:var(--mono);font-size:13px;line-height:1.55;color:#191614}
.tx.plain{font-size:15px;line-height:1.55;color:rgba(247,243,234,.9);display:flex;flex-direction:column;
  justify-content:safe center}
.tx.manifesto{display:flex;flex-direction:column;justify-content:safe center}
/* The centred column above makes a flex item of every inline child, which
   split each <em> onto its own line. All markup goes in one wrapper. */
.tx > .txw{display:block;width:100%}
/* a text surface should look writable the moment edit mode is on */
body.edit .txw,body.edit .tx.note{cursor:text;border-radius:8px;
  transition:box-shadow .16s ease,background .16s ease}
body.edit .txw:hover,body.edit .tx.note:hover{box-shadow:0 0 0 1px rgba(247,243,234,.16)}
body.edit .txw:focus,body.edit .tx.note:focus{outline:none;
  box-shadow:0 0 0 2px color-mix(in srgb,var(--c,#F7F3EA) 60%,transparent);
  background:rgba(255,255,255,.04)}
.tx.plain b{color:#fff}
.imgc{flex:1;background-size:cover;background-position:center}

/* ── chrome ─────────────────────────────────────────────────── */
#nav{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:5px;
  padding:6px;border-radius:100px;background:rgba(18,16,15,.82);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.09);max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none}
#nav::-webkit-scrollbar{display:none}
.chip{all:unset;cursor:pointer;padding:8px 14px;border-radius:99px;font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:rgba(247,243,234,.62);white-space:nowrap;
  display:flex;align-items:center;gap:7px;transition:.16s}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--c);display:block}
.chip:hover{color:#fff;background:rgba(255,255,255,.08)}
.chip[aria-current="true"]{color:#0E0D0C;background:var(--paper)}
.chip[aria-current="true"] i{box-shadow:0 0 0 2px rgba(0,0,0,.15)}

#sig{position:fixed;left:18px;top:16px;z-index:40;display:flex;align-items:center;gap:10px;
  padding:8px 14px 8px 10px;border-radius:14px;background:rgba(18,16,15,.82);
  backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.09);
  cursor:pointer;transition:transform .18s cubic-bezier(.2,.9,.3,1),border-color .18s ease}
#sig:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.22)}
#sig:active{transform:translateY(0)}
/* already home — the mark stops pretending to be a door */
body.universe #sig{cursor:default}
body.universe #sig:hover{transform:none;border-color:rgba(255,255,255,.09)}
#sig .nm{font-family:var(--disp);font-size:19px;line-height:1;letter-spacing:-.01em}
#sig .tg{font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);margin-top:3px}

#tools{position:fixed;right:18px;top:16px;z-index:40;display:flex;gap:5px;padding:6px;
  border-radius:14px;background:rgba(18,16,15,.82);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.09)}
.tb{all:unset;cursor:pointer;padding:8px 11px;border-radius:9px;font-size:11.5px;font-weight:600;
  color:rgba(247,243,234,.72);white-space:nowrap}
.tb:hover{background:rgba(255,255,255,.1);color:#fff}
.tb.on{background:var(--paper);color:#0E0D0C}

#dock{position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(140%);z-index:40;
  display:flex;gap:6px;align-items:center;padding:7px;border-radius:16px;
  background:rgba(18,16,15,.9);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1);
  transition:transform .28s cubic-bezier(.2,.9,.3,1);max-width:calc(100vw - 24px)}
body.edit #dock{transform:translateX(-50%) translateY(0)}
#dock input{all:unset;background:rgba(255,255,255,.07);padding:10px 13px;border-radius:10px;
  width:min(38vw,330px);font-size:13.5px;color:var(--paper)}
#dock input::placeholder{color:rgba(247,243,234,.35)}
#dock select{all:unset;cursor:pointer;background:rgba(255,255,255,.07);padding:10px;border-radius:10px;
  font-size:12px;color:var(--paper)}
#dock select option{background:#1a1817}
.pb{all:unset;cursor:pointer;padding:10px 13px;border-radius:10px;font-size:12.5px;font-weight:700;
  background:rgba(255,255,255,.09);color:var(--paper);white-space:nowrap}
.pb:hover{background:rgba(255,255,255,.18)}
.pb.hero{background:var(--paper);color:#0E0D0C}

#zoom{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;flex-direction:column;gap:4px;
  padding:5px;border-radius:12px;background:rgba(18,16,15,.82);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.09)}
#zoom button{all:unset;cursor:pointer;width:32px;height:30px;text-align:center;border-radius:8px;
  font-size:14px;color:rgba(247,243,234,.75)}
#zoom button:hover{background:rgba(255,255,255,.12);color:#fff}
#zoom .lvl{font-size:9.5px;text-align:center;color:var(--mist);font-family:var(--mono);padding:3px 0}

#tip{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:30;font-size:11.5px;
  color:rgba(247,243,234,.4);pointer-events:none;letter-spacing:.02em}
body.edit #tip{display:none}

#toast{position:fixed;top:76px;left:50%;transform:translateX(-50%) translateY(-12px);z-index:60;
  padding:11px 17px;border-radius:12px;background:var(--paper);color:#0E0D0C;font-size:13px;
  font-weight:500;opacity:0;pointer-events:none;transition:.22s;box-shadow:var(--lift);max-width:82vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

#modal{position:fixed;inset:0;z-index:70;background:rgba(6,5,5,.72);backdrop-filter:blur(6px);
  display:none;place-items:center;padding:22px}
#modal.on{display:grid}
#modal .sh{background:#161413;border:1px solid rgba(255,255,255,.12);border-radius:20px;
  max-width:660px;width:100%;max-height:min(82vh,82dvh);overflow:auto;padding:26px 28px;box-shadow:var(--lift);
  touch-action:pan-y;overscroll-behavior:contain}
#modal h2{font-family:var(--disp);font-size:26px;margin:0 0 12px;letter-spacing:-.01em}
#modal h3{font-family:var(--ui);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--mist);font-weight:700;margin:24px 0 9px}
#modal .lead{font-size:16.5px;line-height:1.5;color:var(--paper)}
#modal .lead b{font-family:var(--disp);font-weight:400;font-style:italic;font-size:19px}
#modal ul{margin:0;padding-left:18px}#modal li{margin:5px 0}
#modal .sw{display:flex;gap:6px;margin:14px 0 2px;flex-wrap:wrap}
#modal .sw span{font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:5px 9px;border-radius:99px;color:#0E0D0C}
#modal p,#modal li{font-size:14px;line-height:1.6;color:rgba(247,243,234,.82)}
#modal pre{background:#0b0a0a;border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:14px;
  overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.5;color:#c9e8d4;max-height:340px}
#modal code{font-family:var(--mono);font-size:12.5px;background:rgba(255,255,255,.08);
  padding:2px 6px;border-radius:5px}

/* ── the universe ───────────────────────────────────────────────
   Every claimed name in the collective, laid out on a phyllotaxis
   spiral so the crowd stays a findable disc instead of a grid. Hover
   lifts a name; clicking one either walks you in or knocks.
   ─────────────────────────────────────────────────────────────── */
#universe{position:fixed;inset:0;z-index:35;display:none;overflow:hidden;
  cursor:grab;background:
  radial-gradient(1200px 900px at 30% 20%, rgba(46,91,255,.09), transparent 60%),
  radial-gradient(1000px 800px at 72% 74%, rgba(123,92,255,.10), transparent 60%),
  #0B0A0A}
body.universe #universe{display:block}
body.universe #nav,body.universe #zoom,body.universe #dock,body.universe #tip,
body.universe #room{display:none}
#universe.drag{cursor:grabbing}
#uspace{position:absolute;left:50%;top:50%;transform-origin:0 0;will-change:transform}
#uspace:before{content:"";position:absolute;left:-190px;top:-190px;width:380px;height:380px;
  border-radius:50%;border:1px dashed rgba(247,243,234,.10);pointer-events:none}
.star{position:absolute;transform:translate(-50%,-50%);cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:transform .22s cubic-bezier(.2,.9,.3,1);white-space:nowrap}
.star .nm{font-family:var(--disp);font-size:26px;letter-spacing:-.01em;color:rgba(247,243,234,.72);
  transition:color .2s ease,text-shadow .2s ease}
.star .hd{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--mist);opacity:0;
  transition:opacity .2s ease}
.star .st{position:absolute;top:-16px;font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;
  padding:3px 8px;border-radius:99px;opacity:0;transition:opacity .2s ease}
.star:hover{transform:translate(-50%,-50%) scale(1.55);z-index:9}
.star:hover .nm{color:#fff;text-shadow:0 0 34px rgba(247,243,234,.45)}
.star:hover .hd,.star:hover .st{opacity:1}
.star.mine .nm{color:var(--paper)}
.star.mine .st{background:var(--paper);color:#0E0D0C;opacity:1}
.star.granted .st{background:#06D6A0;color:#0E0D0C}
.star.pending .st{background:#F5A623;color:#0E0D0C;opacity:1}
.star.denied .st{background:#EF476F;color:#F7F3EA}
.star.mine .nm,.star.granted .nm{color:#fff}
#uhint{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:36;
  font-size:11.5px;color:rgba(247,243,234,.42);pointer-events:none;text-align:center;
  padding:0 16px}
#ucount{position:fixed;left:18px;bottom:18px;z-index:36;font-family:var(--mono);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
/* the knock inbox badge */
#tKnocks{position:relative}
#tKnocks .cnt{position:absolute;top:1px;right:1px;min-width:15px;height:15px;padding:0 4px;
  border-radius:99px;background:#EF476F;color:#fff;font-size:9px;font-weight:800;
  display:grid;place-items:center}
.kn{display:flex;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px solid rgba(255,255,255,.08)}
.kn:last-child{border-bottom:0}
.kn .who{flex:1;min-width:0}
.kn .who b{font-family:var(--disp);font-size:17px;font-weight:400}
.kn .who span{display:block;font-size:12px;color:var(--mist);
  overflow:hidden;text-overflow:ellipsis}
@media(max-width:720px){
  #universe{top:0}
  .star .nm{font-size:21px}
  #uhint{bottom:calc(126px + env(safe-area-inset-bottom));font-size:11px}
  #ucount{left:12px;bottom:calc(126px + env(safe-area-inset-bottom))}
  .kn{flex-wrap:wrap}
}

/* ── entry ──────────────────────────────────────────────────── */
#entry{position:fixed;inset:0;z-index:90;background:#0E0D0C;display:grid;place-items:center;
  transition:opacity .8s ease,visibility .8s}
#entry.gone{opacity:0;visibility:hidden}
#entry .c{text-align:center;padding:20px}
#entry .es{font-family:var(--disp);font-style:italic;font-size:clamp(30px,6vw,56px);
  letter-spacing:-.02em;opacity:0;animation:rise .9s .15s forwards}
#entry .en{font-family:var(--disp);font-size:clamp(46px,11vw,120px);line-height:.94;
  letter-spacing:-.045em;margin-top:6px;opacity:0;animation:rise .9s .45s forwards}
#entry .ed{font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--mist);
  margin-top:20px;opacity:0;animation:rise .9s .8s forwards}
#entry svg{margin-bottom:26px;opacity:0;animation:rise 1s 0s forwards}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
/* ── mobile ─────────────────────────────────────────────────────
   Phone layout is a different information architecture, not a squeeze:
   identity top-left, one camera control top-right, and every action the
   thumb needs stacked along the bottom edge. All offsets respect the
   notch and the home indicator via env(safe-area-inset-*).
   ───────────────────────────────────────────────────────────────── */
@media(max-width:720px){
  /* identity — keep the mark and the tagline, just tighter */
  #sig{left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));
    gap:8px;padding:7px 12px 7px 9px;border-radius:13px}
  #sig .nm{font-size:17px}
  #sig .tg{display:block;font-size:7.5px;letter-spacing:.15em;margin-top:2px}

  /* pinch handles zoom on touch, so only "fit everything" earns a button */
  #zoom{top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));
    bottom:auto;flex-direction:row;padding:4px;border-radius:13px}
  #zoom #zIn,#zoom #zOut,#zoom .lvl{display:none}
  #zoom button{width:46px;height:46px;font-size:17px}

  /* actions become a thumb bar pinned to the bottom edge */
  #tools{top:auto;right:auto;left:0;bottom:0;width:100%;justify-content:center;
    gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    border-radius:20px 20px 0 0;border-left:0;border-right:0;border-bottom:0;
    background:rgba(18,16,15,.94);overflow-x:auto;scrollbar-width:none;touch-action:pan-x}
  #tools::-webkit-scrollbar{display:none}
  .tb{height:46px;padding:0 15px;display:flex;align-items:center;font-size:13px;border-radius:13px}
  #tCode{display:none}          /* exporting a config file is a desktop job */

  /* region chips ride just above the thumb bar */
  #nav{top:auto;bottom:calc(70px + env(safe-area-inset-bottom));
    max-width:calc(100vw - 16px);touch-action:pan-x}
  .chip{padding:9px 13px;font-size:10.5px}

  /* the dock stacks above the chips and wraps instead of clipping */
  #dock{bottom:calc(116px + env(safe-area-inset-bottom));flex-wrap:wrap;justify-content:center;
    gap:5px;max-width:calc(100vw - 16px);padding:8px;
    /* it wraps to two rows here, so 140% no longer clears the screen edge —
       park it a full height PLUS its own bottom offset below the fold */
    transform:translateX(-50%) translateY(calc(100% + 124px + env(safe-area-inset-bottom)))}
  body.edit #dock{transform:translateX(-50%) translateY(0)}
  #dock input{width:calc(100vw - 48px);font-size:16px}   /* 16px = no iOS zoom-on-focus */
  #dock select{font-size:14px}
  .pb{height:44px;display:flex;align-items:center}

  #tip{display:none}
  #toast{top:calc(76px + env(safe-area-inset-top));max-width:calc(100vw - 32px)}

  /* sheets slide up from the bottom, where the thumb already is */
  #modal{place-items:end center;padding:0}
  #modal .sh{border-radius:22px 22px 0 0;max-height:88dvh;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom))}
  #modal h2{font-size:24px}
}

/* narrow phones — drop to icon-weight labels so nothing scrolls off */
@media(max-width:400px){
  .tb{padding:0 12px;font-size:12.5px}
  #sig .tg{display:none}
}
</style>
</head>

<script src="muro.config.js"></script>
<script src="muro.supabase.js" onerror="console.info('[muro] no supabase config — static mode')"></script>
<script>
if(!window.MURO_CONFIG){document.body.innerHTML="<p style='padding:40px;font:16px system-ui;color:#F7F3EA'>muro.config.js not found — keep it next to index.html.</p>";}
/* ═══════════════════════════════════════════════════════════════
   MURO engine. You should rarely need to touch this file —
   muro.config.js is where your wall actually lives.
   ═══════════════════════════════════════════════════════════════ */
const CFG = window.MURO_CONFIG;
const $ = s => document.querySelector(s);
const world = $('#world'), room = $('#room');
const RG = Object.fromEntries(CFG.regions.map(r => [r.key, r]));
const uid = () => 'i' + Math.random().toString(36).slice(2, 8);
let VIEW = { x: 0, y: 0, k: .5 }, Z = 100, EDIT = false;

/* ── providers: URL in, embed out. Zero API keys. ───────────── */
const P = {
  youtube:{l:'YouTube',c:'#FF0033',kind:'video',r:16/9,
    t:u=>/(?:youtube\.com\/(?:watch\?v=|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/.exec(u),
    e:m=>`https://www.youtube-nocookie.com/embed/${m[1]}?autoplay=1&rel=0`,
    th:m=>`https://i.ytimg.com/vi/${m[1]}/hqdefault.jpg`},
  vimeo:{l:'Vimeo',c:'#1AB7EA',kind:'video',r:16/9,
    t:u=>/vimeo\.com\/(\d+)/.exec(u), e:m=>`https://player.vimeo.com/video/${m[1]}?autoplay=1`},
  spotify:{l:'Spotify',c:'#1DB954',kind:'audio',r:1.55,
    t:u=>/open\.spotify\.com\/(?:intl-\w+\/)?(track|album|playlist|artist|episode|show)\/(\w+)/.exec(u),
    e:m=>`https://open.spotify.com/embed/${m[1]}/${m[2]}`},
  soundcloud:{l:'SoundCloud',c:'#FF5500',kind:'audio',r:2.1,
    t:u=>/soundcloud\.com\/[\w-]+\/[\w-]+/.exec(u),
    e:(m,u)=>`https://w.soundcloud.com/player/?url=${encodeURIComponent(u)}&color=%23ff4d2e&auto_play=true&show_comments=false`},
  applemusic:{l:'Apple Music',c:'#FA2D48',kind:'audio',r:1.5,
    t:u=>/music\.apple\.com\//.exec(u), e:(m,u)=>u.replace('music.apple.com','embed.music.apple.com')},
  bandcamp:{l:'Bandcamp',c:'#629AA9',kind:'audio',r:1.4,t:u=>/\.bandcamp\.com\/(album|track)\//.exec(u)},
  suno:{l:'Suno',c:'#EDEDED',kind:'audio',r:1.3,t:u=>/suno\.(com|ai)\/song\//.exec(u)},
  instagram:{l:'Instagram',c:'#E4489B',kind:'post',r:.8,
    t:u=>/instagram\.com\/(?:p|reel|tv)\/([\w-]+)/.exec(u),
    e:m=>`https://www.instagram.com/p/${m[1]}/embed/captioned/`},
  igprofile:{l:'Instagram',c:'#E4489B',kind:'page',r:1.2,t:u=>/instagram\.com\/?$|instagram\.com\/[\w.]+\/?$/.exec(u)},
  tiktok:{l:'TikTok',c:'#EDEDED',kind:'video',r:.62,
    t:u=>/tiktok\.com\/@[\w.-]+\/video\/(\d+)/.exec(u), e:m=>`https://www.tiktok.com/embed/v2/${m[1]}`},
  twitch:{l:'Twitch',c:'#9146FF',kind:'video',r:16/9, t:u=>/twitch\.tv\/(\w+)\/?$/.exec(u),
    e:m=>`https://player.twitch.tv/?channel=${m[1]}&parent=${location.hostname||'localhost'}&muted=true`},
  kick:{l:'Kick',c:'#53FC18',kind:'video',r:16/9,t:u=>/kick\.com\/([\w-]+)\/?$/.exec(u),
    e:m=>`https://player.kick.com/${m[1]}`},
  mastodon:{l:'Mastodon',c:'#6364FF',kind:'post',r:1.4,
    t:u=>/^https?:\/\/[\w.-]+\/@[\w.-]+\/(\d+)/.exec(u), e:(m,u)=>u+'/embed'},
  bluesky:{l:'Bluesky',c:'#0085FF',kind:'post',r:1.5,t:u=>/bsky\.app\/profile\/[\w.:-]+\/post\//.exec(u)},
  x:{l:'X',c:'#EDEDED',kind:'post',r:1.3,t:u=>/(?:twitter|x)\.com\/\w+\/status\//.exec(u)},
  github:{l:'GitHub',c:'#8B95A8',kind:'page',r:1.35,t:u=>/github\.com\//.exec(u)},
  kickstarter:{l:'Kickstarter',c:'#05CE78',kind:'page',r:1.15,
    t:u=>/kickstarter\.com\/projects\/([\w-]+\/[\w-]+)/.exec(u),
    e:m=>`https://www.kickstarter.com/projects/${m[1]}/widget/card.html`},
  substack:{l:'Substack',c:'#FF6719',kind:'page',r:1.25,t:u=>/substack\.com\//.exec(u)},
  calendly:{l:'Calendly',c:'#006BFF',kind:'page',r:.95,t:u=>/calendly\.com\/[\w-]/.exec(u),e:(m,u)=>u},
  adult:{l:'Blocked',c:'#8B0000',kind:'page',r:1,t:u=>/(onlyfans|fansly)\.com/.exec(u),block:true},
};
const prov = u => { for (const k in P) { const m = P[k].t(u); if (m) return { ...P[k], key:k, m, url:u }; } return null; };
const dom = u => { try { return new URL(u).hostname.replace(/^www\./,''); } catch { return u.slice(0,26); } };
const esc = s => String(s ?? '').replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

/* ── camera ─────────────────────────────────────────────────── */
function apply(anim){
  world.style.transition = anim ? 'transform .72s cubic-bezier(.22,.9,.25,1)' : 'none';
  world.style.transform = `translate(${VIEW.x}px,${VIEW.y}px) scale(${VIEW.k})`;
  $('#zLvl').textContent = Math.round(VIEW.k * 100) + '%';
}
function frame(bx, by, bw, bh, anim = true, pad = 120){
  const vw = innerWidth, vh = innerHeight, mob = vw <= 720;
  // On a phone a flat 120px pad ate two thirds of the viewport. Scale the
  // margin down and subtract the chrome bars so the fit lands in the part
  // of the screen you can actually see.
  const p    = mob ? 16 : pad;
  const top  = mob ? 84 : 0;    // identity + fit button
  const bot  = mob ? 132 : 0;   // region chips + thumb bar
  const availH = vh - top - bot - p*2;
  const k = Math.min((vw - p*2)/bw, availH/bh, 1.15);
  VIEW.k = Math.max(.12, k);
  VIEW.x = vw/2 - (bx + bw/2) * VIEW.k;
  VIEW.y = top + (vh - top - bot)/2 - (by + bh/2) * VIEW.k;
  apply(anim);
}
function bboxAll(){
  const rs = CFG.regions;
  const x1 = Math.min(...rs.map(r=>r.x)), y1 = Math.min(...rs.map(r=>r.y));
  const x2 = Math.max(...rs.map(r=>r.x+r.w)), y2 = Math.max(...rs.map(r=>r.y+r.h));
  return [x1,y1,x2-x1,y2-y1];
}
const fitAll = (anim=true) => frame(...bboxAll(), anim, 90);

/* ── render ─────────────────────────────────────────────────── */
function paint(){
  world.innerHTML = '';
  const [bx,by,bw,bh] = bboxAll();
  world.style.width = (bx+bw+400)+'px'; world.style.height = (by+bh+400)+'px';
  CFG.regions.forEach(r => {
    const d = document.createElement('div');
    d.className = 'region' + (r.shape === 'circle' ? ' circle' : '') + (r.key === 'one' ? ' pubzone' : '');
    d.dataset.k = r.key;
    d.style.cssText = `left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;--c:${r.color}`;
    d.innerHTML = `<div class="glow"></div><div class="ring"></div>
      <div class="label">${r.name}</div><div class="sub">${r.sub}</div>
      <div class="live"><b></b>Live · anyone can see this</div>`;
    world.appendChild(d);
    hookRegion(d, r);
  });
  CFG.items.forEach(drawItem);
}
/* ── text that fits its card ─────────────────────────────────────
   Cards are hand-sized and the words are hand-written, so a block will
   sometimes be taller than the box it lives in. Scrolling inside a card
   is a terrible way to read a manifesto — shrink the type instead, down
   to a floor, and only give up (and scroll) past that.
   ──────────────────────────────────────────────────────────────── */
const TX_BASE = new WeakMap();
function fitText(el){
  if (!el) return;
  if (el.contains(document.activeElement) && document.activeElement.isContentEditable)
    return;                                          // don't fight the typist mid-word
  let base = TX_BASE.get(el);
  if (base == null){ base = parseFloat(getComputedStyle(el).fontSize) || 15; TX_BASE.set(el, base); }
  let size = base;
  el.style.fontSize = size + 'px';
  const floor = base * .55;
  for (let i = 0; i < 40 && size > floor; i++){
    if (el.scrollHeight <= el.clientHeight + 1) break;
    size -= Math.max(.5, size * .05);
    el.style.fontSize = size + 'px';
  }
}
const refitAll = () => document.querySelectorAll('.tx').forEach(fitText);
// Instrument Serif arrives after first paint and changes every metric.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(refitAll);
// Resizing a card in edit mode has to re-fit too.
const TX_RO = new ResizeObserver(es => es.forEach(e => fitText(e.target)));
function drawItem(it){
  const r = RG[it.region] || RG.one;
  let el = document.getElementById('c_'+it.id);
  if (!el){ el = document.createElement('div'); el.className='card'; el.id='c_'+it.id; world.appendChild(el); }
  const p = it.kind === 'link' ? prov(it.url) : null;
  if (!it.h) it.h = Math.round(it.w / (p ? p.r : 1.3));
  el.classList.toggle('pub', !!it.pub);
  el.style.cssText = `left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;`
    + `transform:rotate(${it.rot||0}deg);--c:${p ? p.c : r.color};z-index:${it.z||5}`;
  el.innerHTML = `<div class="hdr"><span class="dot"></span><b>${esc(p?p.l:it.kind)}</b>
      <button data-a="front" title="front">▲</button><button data-a="del" title="remove">✕</button></div>
    <div class="in"></div><div class="rz"></div>`;
  const box = el.querySelector('.in');

  if (it.kind === 'words'){
    const d = document.createElement('div');
    d.className = 'tx ' + (it.tone === 'manifesto' ? 'manifesto' : 'plain');
    d.style.setProperty('--c', r.color);
    const w = document.createElement('div');
    w.className = 'txw';
    w.innerHTML = it.text || '';
    // The wrapper is what you type into, not .tx — editing .tx directly lets
    // the browser dissolve the wrapper and the flex layout goes with it.
    w.contentEditable = String(EDIT);
    w.addEventListener('input',  () => { it.text = w.innerHTML; });
    w.addEventListener('blur',   () => { it.text = w.innerHTML; fitText(d); });
    d.appendChild(w);
    box.appendChild(d);
    fitText(d); TX_RO.observe(d);
    if (it.tone !== 'manifesto') el.style.background = 'linear-gradient(160deg,#1b1917,#131110)';
  }
  else if (it.kind === 'note'){
    const d = document.createElement('div');
    d.className = 'tx note'; d.textContent = it.text || '';
    el.style.background = it.paper || '#F2E39B';
    d.contentEditable = String(EDIT);
    d.addEventListener('input', () => it.text = d.textContent);
    box.appendChild(d);
    fitText(d); TX_RO.observe(d);
  }
  else if (it.kind === 'image'){
    const d = document.createElement('div'); d.className = 'imgc';
    if (it.url) d.style.backgroundImage = `url("${it.url}")`;
    else d.style.cssText += `background:repeating-linear-gradient(45deg,${r.color}22 0 12px,transparent 12px 24px);
      display:grid;place-items:center;color:${r.color};font-size:12px;letter-spacing:.16em;text-transform:uppercase`;
    if (!it.url) d.textContent = 'add an image url';
    box.appendChild(d);
  }
  else if (p && p.block){
    const d = document.createElement('div'); d.className='tx plain';
    d.innerHTML = '<div class="txw"><b>Blocked at ingest.</b><br>Adult platforms pull your whole payment stack under Mastercard BRAM and Visa VIRP rules. Not worth it.</div>';
    box.appendChild(d);
  }
  else if (p && p.e && it.live){
    const f = document.createElement('iframe'); f.className='live'; f.src = p.e(p.m, it.url);
    f.loading='lazy'; f.allowFullscreen = true;
    f.allow='autoplay; encrypted-media; picture-in-picture; clipboard-write; fullscreen';
    f.referrerPolicy='strict-origin-when-cross-origin';
    box.appendChild(f);
  }
  else if (p && p.e){
    const d = document.createElement('div'); d.className = 'fa' + (p.kind==='audio'?' audio':'');
    const th = it.thumb || (p.th ? p.th(p.m) : '');
    d.innerHTML = `<div class="th" style="background-image:url('${th}');background-color:${p.c}22"></div>
      <div class="sc"></div><div class="hint">click to play</div><div class="pl"></div>
      <div class="mt"><span class="bd"><span style="width:7px;height:7px;border-radius:50%;background:${p.c};display:inline-block"></span>${p.l}</span>
      <h3>${esc(it.title || p.l)}</h3>${it.sub?`<div class="sb">${esc(it.sub)}</div>`:''}</div>`;
    d.addEventListener('click', e => { if (!EDIT){ it.live = true; drawItem(it); } });
    box.appendChild(d);
  }
  else {
    const a = document.createElement('a');
    a.className='lk'; a.href = it.url || '#'; a.target='_blank'; a.rel='noopener me';
    a.style.setProperty('--c', p ? p.c : r.color);
    a.innerHTML = `<div><div class="ic" style="background:${p?p.c:r.color}">${(p?p.l:dom(it.url||'·'))[0].toUpperCase()}</div>
      <h3>${esc(it.title || dom(it.url||''))}</h3><div class="dm">${esc(dom(it.url||''))}</div>
      ${it.sub?`<div class="dm" style="margin-top:7px;opacity:.9">${esc(it.sub)}</div>`:''}</div>
      <div class="go">Open ↗</div>`;
    box.appendChild(a);
  }
  hookItem(el, it);
}

/* ── what is public ──────────────────────────────────────────────
   ONE is the shop window. An item is public when its CENTRE lands
   inside ONE — centre, not corners, so a card that merely overhangs
   the edge doesn't accidentally go live. Drag it out and it is his
   again. The client only decides what to STORE; get_wall() in
   Postgres is what actually withholds private items from visitors,
   so this can never become fake privacy.
   ──────────────────────────────────────────────────────────────── */
const oneRegion = () => CFG.regions.find(r => r.key === 'one');
function inPublic(it){
  const o = oneRegion(); if (!o) return false;
  const cx = it.x + it.w/2, cy = it.y + it.h/2;
  const rx = o.w/2, ry = o.h/2;
  if (o.shape === 'circle'){
    const dx = (cx - (o.x+rx))/rx, dy = (cy - (o.y+ry))/ry;
    return dx*dx + dy*dy <= 1;
  }
  return cx > o.x && cx < o.x+o.w && cy > o.y && cy < o.y+o.h;
}
function syncPub(it, el, announce){
  const was = !!it.pub, now = inPublic(it);
  it.pub = now;
  el = el || document.getElementById('c_'+it.id);
  if (el) el.classList.toggle('pub', now);
  if (announce && was !== now)
    toast(now ? 'Public — everyone on Life Is One can see this now'
              : 'Private again — this is yours alone');
}
const syncAllPub = () => CFG.items.forEach(it => syncPub(it, null, false));

/* ── regions move too ────────────────────────────────────────────
   Pick a region up by its name and the whole neighbourhood travels
   with it — otherwise dragging MAKE would leave its cards stranded.
   ──────────────────────────────────────────────────────────────── */
function hookRegion(el, r){
  const grip = el.querySelector('.label');
  grip.addEventListener('pointerdown', e => {
    if (!EDIT) return;
    e.preventDefault(); e.stopPropagation(); grip.setPointerCapture(e.pointerId);
    el.classList.add('dragging');
    const sx = e.clientX, sy = e.clientY, ox = r.x, oy = r.y;
    const mine = CFG.items.filter(it => it.region === r.key)
                          .map(it => ({ it, ix: it.x, iy: it.y }));
    const mv = ev => {
      const dx = (ev.clientX - sx)/VIEW.k, dy = (ev.clientY - sy)/VIEW.k;
      r.x = ox + dx; r.y = oy + dy;
      el.style.left = r.x + 'px'; el.style.top = r.y + 'px';
      mine.forEach(({ it, ix, iy }) => {
        it.x = ix + dx; it.y = iy + dy;
        const c = document.getElementById('c_'+it.id);
        if (c){ c.style.left = it.x+'px'; c.style.top = it.y+'px'; }
      });
      if (r.key === 'one') syncAllPub();      // the window itself moved
      else mine.forEach(({ it }) => syncPub(it, null, false));
    };
    const up = () => {
      el.classList.remove('dragging');
      syncAllPub();
      grip.removeEventListener('pointermove', mv); grip.removeEventListener('pointerup', up);
    };
    grip.addEventListener('pointermove', mv); grip.addEventListener('pointerup', up);
  });
}

function hookItem(el, it){

  if (pinch) return;                       // two fingers down: that's a zoom, not a pan
  room.classList.add('drag'); room.setPointerCapture(e.pointerId);
  const sx=e.clientX, sy=e.clientY, ox=VIEW.x, oy=VIEW.y;
  const mv = ev => { if (pinch) return; VIEW.x = ox + ev.clientX - sx; VIEW.y = oy + ev.clientY - sy; apply(false); };
  const up = () => { room.classList.remove('drag');
    room.removeEventListener('pointermove',mv); room.removeEventListener('pointerup',up); };
  room.addEventListener('pointermove',mv); room.addEventListener('pointerup',up);
});
room.addEventListener('wheel', e => {
  e.preventDefault();
  const f = Math.exp(-e.deltaY * .0016);
  const k2 = Math.min(2.2, Math.max(.1, VIEW.k * f));
  VIEW.x = e.clientX - (e.clientX - VIEW.x) * (k2/VIEW.k);
  VIEW.y = e.clientY - (e.clientY - VIEW.y) * (k2/VIEW.k);
  VIEW.k = k2; apply(false);
  document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-current','false'));
}, { passive:false });
let pinch = null;
room.addEventListener('touchstart', e => {
  if (e.touches.length === 2){
    const [a,b] = e.touches;
    pinch = { d: Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY), k: VIEW.k };
  }
}, { passive:true });
room.addEventListener('touchmove', e => {
  if (e.touches.length === 2 && pinch){
    const [a,b] = e.touches;
    const d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    const cx=(a.clientX+b.clientX)/2, cy=(a.clientY+b.clientY)/2;
    const k2 = Math.min(2.2, Math.max(.1, pinch.k * d/pinch.d));
    VIEW.x = cx - (cx - VIEW.x)*(k2/VIEW.k); VIEW.y = cy - (cy - VIEW.y)*(k2/VIEW.k);
    VIEW.k = k2; apply(false);
  }
}, { passive:true });
room.addEventListener('touchend', () => pinch = null);
const zoomBy = f => { const k2 = Math.min(2.2, Math.max(.1, VIEW.k*f));
  VIEW.x = innerWidth/2 - (innerWidth/2 - VIEW.x)*(k2/VIEW.k);
  VIEW.y = innerHeight/2 - (innerHeight/2 - VIEW.y)*(k2/VIEW.k); VIEW.k = k2; apply(true); };

/* ── config round-trip: visual edits → the file you vibe-code ── */
function toConfig(){
  const q = s => JSON.stringify(s ?? '');
  const line = it => {
    const bits = [`id:${q(it.id)}`, `region:${q(it.region)}`, `kind:${q(it.kind)}`];
    if (it.tone) bits.push(`tone:${q(it.tone)}`);
    if (it.paper) bits.push(`paper:${q(it.paper)}`);
    bits.push(`x:${Math.round(it.x)}`, `y:${Math.round(it.y)}`, `w:${Math.round(it.w)}`,
              `h:${Math.round(it.h)}`, `rot:${+(it.rot||0).toFixed(1)}`);
    if (it.url) bits.push(`url:${q(it.url)}`);
    if (it.title) bits.push(`title:${q(it.title)}`);
    if (it.sub) bits.push(`sub:${q(it.sub)}`);
    if (it.thumb) bits.push(`thumb:${q(it.thumb)}`);
    if (it.text) bits.push(`text:${q(it.text)}`);
    return '    { ' + bits.join(', ') + ' },';
  };
  const reg = r => `    { key:${q(r.key)}, name:${q(r.name)}, sub:${q(r.sub)}, color:${q(r.color)}, `
    + `x:${r.x}, y:${r.y}, w:${r.w}, h:${r.h} },`;
  return `/* MURO — muro.config.js
   Exported from the visual editor. Edit freely, save, refresh.
   Every field here is documented in the original config file. */

window.MURO_CONFIG = {

  identity: ${JSON.stringify(CFG.identity, null, 2).replace(/\n/g, '\n  ')},

  regions: [
${CFG.regions.map(reg).join('\n')}
  ],

  items: [
${CFG.items.map(line).join('\n')}
  ],
};
`;
}

const b64u = b => btoa(String.fromCharCode(...b)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const ub64u = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));

(async function live(){

  if (!configured){ console.info('[muro] static mode — add muro.supabase.js to go live'); return; }

  const db = createClient(S.url, S.anonKey);

  /* which wall are we looking at? /luk  ·  /?h=luk  ·  /  → rootHandle */
  const seg = location.pathname.replace(/^\/+|\/+$/g,'').split('/')[0].toLowerCase();
  const qs  = new URLSearchParams(location.search).get('h');
  const HANDLE = (qs || (seg && !/\.(html?|js|css|png|jpe?g|svg|ico|txt|json)$/.test(seg) ? seg : '') || S.rootHandle || '').toLowerCase();

    if (!HANDLE){ await openUniverse(false, true); return; }  // the front door is everybody

    const row = Array.isArray(data) ? data[0] : data;
    if (error || !row){
      // not published (or not there yet) — if it's mine I can still see it
      const { data: own } = await db.from('walls').select('*').eq('handle', HANDLE).maybeSingle();
      if (!own) return;                       // fall back to muro.config.js
      return hydrate(own);
    }
    hydrate(row);
  }
  function hydrate(row){
    ROW = row;
    if (row.identity && Object.keys(row.identity).length) CFG.identity = row.identity;
    if (Array.isArray(row.regions) && row.regions.length){
      CFG.regions = row.regions;
      Object.keys(RG).forEach(k => delete RG[k]);
      CFG.regions.forEach(r => RG[r.key] = r);

    $('#mEmail').focus();
    $('#mSend').onclick = async () => {
      const email = $('#mEmail').value.trim();
      if (!email) return;
      $('#mSend').textContent = 'Sending…';
      const { error } = await db.auth.signInWithOtp({
        email, options: { emailRedirectTo: location.origin + location.pathname } });
      modal(error ? 'That didn\'t send' : 'Check your email',
        error ? `<p>${error.message}</p>` :
        `<p>A link is on its way to <b>${email}</b>. Open it on this device and you'll land back here, signed in.</p>`);
    };
  }
  function accountSheet(){
    modal('You', `<p>Signed in as <b>${ME.email}</b>${ROW ? ` · owner of <b>${ROW.handle}</b>` : ''}.</p>
      ${ROW ? `<p style="font-size:13px;color:#9A938A">${ROW.views ?? 0} views · last saved ${
        ROW.updated_at ? new Date(ROW.updated_at).toLocaleString() : '—'}</p>` : ''}
      <p><button class="pb" id="mOut">Sign out</button></p>`);
    $('#mOut').onclick = async () => { await db.auth.signOut(); location.reload(); };
  }

  /* ── claim a handle ────────────────────────────────────────── */
  function claimSheet(){
    modal('Claim your MURO', `
      <p>Pick the handle this room lives at, and paste the invite code you were given.</p>
      <p style="display:flex;gap:8px;align-items:center">
        <span style="color:#9A938A;font-family:var(--mono);font-size:13px">lifeisone.co/</span>
        <input id="mH" placeholder="yourname" style="flex:1;padding:12px 14px;border-radius:10px;
          border:1px solid rgba(247,243,234,.2);background:rgba(255,255,255,.06);color:#F7F3EA;font:inherit"></p>
      <p><input id="mInv" placeholder="invite code" style="width:100%;padding:12px 14px;border-radius:10px;
          border:1px solid rgba(247,243,234,.2);background:rgba(255,255,255,.06);color:#F7F3EA;font:inherit"></p>
      <p><button class="pb hero" id="mGo">Claim it</button> <span id="mMsg" style="color:#9A938A;font-size:13px"></span></p>`);
    $('#mGo').onclick = async () => {
      const h = $('#mH').value.trim().toLowerCase(), code = $('#mInv').value.trim();
      const msg = t => $('#mMsg').textContent = t;
      if (!h) return msg('pick a handle');
      const { data: free } = await db.rpc('handle_available', { p_handle: h });
      if (!free) return msg('taken or not allowed');
      if (code){
        const { data: ok } = await db.rpc('claim_invite', { p_code: code });
        if (!ok) msg('that code is used or invalid — trying anyway');
      }
      const { data, error } = await db.from('walls').insert({
        handle: h, owner: ME.id, identity: CFG.identity,
        regions: CFG.regions, items: CFG.items, published: true,
      }).select().single();
      if (error) return msg(error.message.includes('policy') ? 'you need a valid invite code' : error.message);
      ROW = data; MINE = true; paintChrome();
      modal('It\'s live', `<p>Your room is at <b>${location.origin}/${data.handle}</b>.</p>
        <p>Press <code>E</code>, move things, hit <b>Save</b>. That's the whole loop from now on.</p>`);
      history.replaceState({}, '', '/' + data.handle);
    };
  }

  /* ── save ──────────────────────────────────────────────────── */
  async function saveWall(){
    const btn = $('#mSave'); btn.textContent = 'Saving…';
    const { error } = await db.from('walls').update({
      identity: CFG.identity, regions: CFG.regions,
      items: CFG.items.map(({ live, ...rest }) => rest),   // don't persist "was playing"
    }).eq('id', ROW.id);
    btn.textContent = 'Save';
    toast(error ? 'Save failed: ' + error.message : 'Saved');
  }
  addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 's' && MINE){ e.preventDefault(); saveWall(); }
  });

  /* ── image upload — for the paintings ──────────────────────── */
  function addUploadButton(){
    const dock = $('#dock');
    const b = document.createElement('button');
    b.className = 'pb'; b.id = 'mUp'; b.textContent = '↑ Image';
    const inp = document.createElement('input');
    inp.type = 'file'; inp.accept = 'image/*'; inp.multiple = true; inp.style.display = 'none';
    b.onclick = () => inp.click();
    inp.onchange = async () => {
      for (const f of inp.files){
        const path = `${ME.id}/${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;
        const { error } = await db.storage.from('muro').upload(path, f, { cacheControl: '31536000' });
        if (error){ toast('Upload failed: ' + error.message); continue; }
        const { data } = db.storage.from('muro').getPublicUrl(path);
        const img = new Image();
        img.onload = () => { const it = addItem({ kind:'image', url:data.publicUrl, w:320 });
          it.h = Math.round(320 * img.height / img.width); drawItem(it); };
        img.src = data.publicUrl;
      }
      toast('Uploaded — drag it where it belongs, then Save');
      inp.value = '';
    };
    dock.appendChild(b); dock.appendChild(inp);
  }

  /* ── enrich pasted links via the edge function ─────────────── */
  const FN = `${S.url}/functions/v1/resolve`;
  window.enrichItem = async function(it){
    if (!it.url) return;
    try {
      const r = await fetch(FN, { method:'POST',
        headers:{ 'content-type':'application/json', apikey:S.anonKey, Authorization:`Bearer ${S.anonKey}` },
        body: JSON.stringify({ url: it.url }) });
      if (!r.ok) return;
      const j = await r.json();
      if (j.title && !it.title) it.title = j.title;
      if (j.thumb && !it.thumb) it.thumb = j.thumb;
      if (j.desc  && !it.sub)   it.sub   = j.desc.slice(0, 120);
      if (j.ratio && !it._sized){ it.h = Math.round(it.w / j.ratio); it._sized = true; }
      drawItem(it);
    } catch {}
  };
  const _add = $('#dAdd').onclick;
  $('#dAdd').onclick = () => { const before = CFG.items.length; _add();
    if (CFG.items.length > before) window.enrichItem(CFG.items[CFG.items.length - 1]); };

  /* ══════════════════════════════════════════════════════════════
     THE UNIVERSE — everyone who has claimed a room, and the door
     protocol between them. Every decision about who may see what is
     made in Postgres (directory / knock / respond_knock / get_wall);
     this only draws the result and sends the asks.
     ══════════════════════════════════════════════════════════════ */
  const GOLDEN = Math.PI * (3 - Math.sqrt(5));
  const UV = { x:0, y:0, k:1 };
  let STARS = [];

  const uspace = document.getElementById('uspace');
  const uni    = document.getElementById('universe');

  function uapply(anim){
    uspace.style.transition = anim ? 'transform .6s cubic-bezier(.22,.9,.25,1)' : 'none';
    uspace.style.transform = `translate(${UV.x}px,${UV.y}px) scale(${UV.k})`;
  }

  // Phyllotaxis: the packing a sunflower uses. Keeps any number of names in a
  // tight, even disc — nobody ends up marooned, and the newest sit just past
  // the middle rather than at the end of a queue.
  const seat = i => {
    const r = 132 * Math.sqrt(i), a = i * GOLDEN;
    return { x: Math.cos(a)*r, y: Math.sin(a)*r };
  };

  const LABEL = { mine:'you', granted:'open', pending:'knocked', denied:'not yet' };

  async function openUniverse(push, keepEntry){
    document.body.classList.add('universe');
    document.getElementById('uhint').style.display = '';
    document.getElementById('ucount').style.display = '';
    // On first load the splash is still up and it IS the act of entering —
    // let enter() dismiss it, so the welcome fires on its way through.
    if (!keepEntry) $('#entry').classList.add('gone');
    if (push) history.pushState({ u:1 }, '', '/');
    const { data, error } = await db.rpc('directory');
    if (error){ toast('Could not reach the universe'); return; }
    STARS = data || [];
    uspace.innerHTML = '';
    STARS.forEach((w, i) => {
      const p = seat(i);
      const el = document.createElement('div');
      el.className = 'star ' + (w.access || 'none');
      el.style.left = p.x + 'px'; el.style.top = p.y + 'px';
      el.innerHTML = `<div class="st">${LABEL[w.access] || 'knock'}</div>
        <div class="nm">${esc(w.name)}</div>
        <div class="hd">lifeisone.co/${esc(w.handle)}</div>`;
      el.onclick = ev => { ev.stopPropagation(); tapStar(w); };
      uspace.appendChild(el);
    });
    document.getElementById('ucount').textContent =
      STARS.length + (STARS.length === 1 ? ' room' : ' rooms');
    document.getElementById('uhint').textContent = ME
      ? 'drag to drift · hover a name · click to knock'
      : 'drag to drift · sign in to knock on a door';
    UV.x = 0; UV.y = 0; UV.k = 1; uapply(false);
  }

  function closeUniverse(){
    document.body.classList.remove('universe');
    document.getElementById('uhint').style.display = 'none';
    document.getElementById('ucount').style.display = 'none';
  }

  function tapStar(w){
    if (w.access === 'mine' || w.access === 'granted'){ location.href = '/' + w.handle; return; }
    if (!ME){
      modal('Sign in to knock', `<p>Doors in here open from the inside. Sign in and
        <b>${esc(w.name)}</b> can decide whether to let you through.</p>
        <p><button class="pb hero" id="kSign">Sign in</button></p>`);
      $('#kSign').onclick = () => { $('#modal').classList.remove('on'); signInSheet(); };
      return;
    }
    if (w.access === 'pending'){
      modal('Already knocked', `<p>You've knocked on <b>${esc(w.name)}</b>'s door.
        Nothing more to do — it opens when they say so.</p>
        <p style="color:#9A938A;font-size:13px">Meanwhile you can see their
        <b>ONE</b> circle, which is public.</p>
        <p><button class="pb" id="kPeek">See their ONE</button></p>`);
      $('#kPeek').onclick = () => location.href = '/' + w.handle;
      return;
    }
    knockSheet(w);
  }

  function knockSheet(w){
    modal('Knock on ' + esc(w.name) + "'s door", `
      <p>They'll see that it was you. If they open it, you can walk into their
      whole room — not just the public circle — until they change their mind.</p>
      <p><input id="kNote" maxlength="240" placeholder="say something (optional) — e.g. it's your sister"
        style="width:100%;padding:12px 14px;border-radius:12px;
        border:1px solid rgba(247,243,234,.2);background:rgba(255,255,255,.06);
        color:#F7F3EA;font:inherit;font-size:15px"></p>
      <p><button class="pb hero" id="kGo">Knock</button>
         <button class="pb" id="kPeek2">Just see their ONE</button></p>
      <p id="kMsg" style="color:#9A938A;font-size:13px"></p>`);
    $('#kPeek2').onclick = () => location.href = '/' + w.handle;
    $('#kGo').onclick = async () => {
      $('#kGo').textContent = 'Knocking…';
      const { data, error } = await db.rpc('knock',
        { p_handle: w.handle, p_note: $('#kNote').value.trim() || null });
      const said = error ? 'error' : data;
      const HOW = {
        'knocked'             : 'Knocked. It opens when they say so.',
        'already-knocked'     : 'You had already knocked — still waiting.',
        'already-in'          : "You're already in. Go on through.",
        'claim-a-handle-first': 'Claim your own handle first — doors open both ways.',
        'no-such-wall'        : 'That room has gone.',
        'thats-you'           : "That's your own door.",
        'sign-in-required'    : 'Sign in first.',
      };
      $('#modal').classList.remove('on');
      toast(HOW[said] || 'Something went wrong knocking');
      if (said === 'knocked' || said === 'already-in') openUniverse(false);
    };
  }

  /* ── who is at my door ──────────────────────────────────────── */
  async function refreshKnocks(){
    const btn = $('#tKnocks');
    if (!ME || !ROW){ btn.style.display = 'none'; return; }
    const { data } = await db.rpc('knocks');
    const rows = data || [];
    const waiting = rows.filter(r => r.status === 'pending').length;
    btn.style.display = '';
    btn.innerHTML = 'Knocks' + (waiting ? `<span class="cnt">${waiting}</span>` : '');
    btn._rows = rows;
  }

  function knocksSheet(){
    const rows = $('#tKnocks')._rows || [];
    const pend = rows.filter(r => r.status === 'pending');
    const open = rows.filter(r => r.status === 'granted');
    const row = (r, actions) => `<div class="kn" data-id="${r.id}">
        <div class="who"><b>${esc(r.name)}</b>
          <span>lifeisone.co/${esc(r.handle)}${r.note ? ' · “' + esc(r.note) + '”' : ''}</span></div>
        ${actions}</div>`;
    modal('Your door', `
      ${pend.length ? '<h3>Waiting</h3>' + pend.map(r => row(r,
        `<button class="pb hero" data-y="${r.id}">Come in</button>
         <button class="pb" data-n="${r.id}">Not yet</button>`)).join('') : ''}
      ${open.length ? '<h3>Have the key</h3>' + open.map(r => row(r,
        `<button class="pb" data-rv="${r.id}">Revoke</button>`)).join('') : ''}
      ${!pend.length && !open.length
        ? '<p>Nobody at the door yet. When someone in the collective clicks your name in the universe, they land here.</p>'
        : ''}`);
    $('#modalc').querySelectorAll('[data-y],[data-n],[data-rv]').forEach(b => b.onclick = async () => {
      b.textContent = '…';
      const id = b.dataset.y || b.dataset.n || b.dataset.rv;
      const fn = b.dataset.rv ? ['revoke_access', { p_id:id }]
                              : ['respond_knock', { p_id:id, p_accept: !!b.dataset.y }];
      await db.rpc(fn[0], fn[1]);
      await refreshKnocks();
      $('#modal').classList.remove('on');
      toast(b.dataset.y ? 'Opened — they can walk in now'
           : b.dataset.n ? 'Left closed'
           : 'Revoked — they are back outside');
    });
  }

  $('#tKnocks').onclick = knocksSheet;
  $('#tUni').onclick = () => openUniverse(true);

  // The mark is the way home. No page load — the universe is already in here.
  const sig = $('#sig');
  sig.title = 'Back to the universe';
  sig.setAttribute('role', 'button');
  sig.setAttribute('tabindex', '0');
  const goHome = () => { if (!document.body.classList.contains('universe')) openUniverse(true); };
  sig.addEventListener('click', goHome);
  sig.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); goHome(); }
  });
  addEventListener('popstate', () => location.reload());

  /* ── drift ──────────────────────────────────────────────────── */
  uni.addEventListener('pointerdown', e => {
    if (e.target.closest('.star')) return;
    uni.classList.add('drag'); uni.setPointerCapture(e.pointerId);
    const sx=e.clientX, sy=e.clientY, ox=UV.x, oy=UV.y;
    const mv = ev => { UV.x = ox + ev.clientX - sx; UV.y = oy + ev.clientY - sy; uapply(false); };
    const up = () => { uni.classList.remove('drag');
      uni.removeEventListener('pointermove',mv); uni.removeEventListener('pointerup',up); };
    uni.addEventListener('pointermove',mv); uni.addEventListener('pointerup',up);
  });
  uni.addEventListener('wheel', e => {
    e.preventDefault();
    UV.k = Math.min(2.4, Math.max(.25, UV.k * Math.exp(-e.deltaY * .0016)));
    uapply(false);
  }, { passive:false });

  /* if you are looking at someone's public circle, say so ────── */
  function strangerBar(){
    if (!ROW || ROW.access === 'mine' || ROW.access === 'granted') return;
    const n = CFG.identity.name || HANDLE;
    toast(`You're seeing ${n}'s public ONE — knock to see the rest`);
  }

  window.openUniverse = openUniverse;
  window.refreshKnocks = refreshKnocks;
  window.strangerBar = strangerBar;

  // Boot last: load() may open the universe, which closes over the consts above.
  await load();
  await refreshMe();

  console.info('[muro] live · handle:', HANDLE || '(universe)');
})();

</script>
</body></html>
